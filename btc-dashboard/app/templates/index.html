<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitcoin Node Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <div class="max-w-6xl mx-auto p-4">
      <header class="flex items-center justify-between mb-4">
        <h1 class="text-2xl font-semibold">Bitcoin Node Dashboard</h1>
        <div id="status-pill" class="flex items-center gap-2">
          <div id="status-dot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
          <div id="status-text" class="text-sm">Connecting...</div>
        </div>
      </header>

      <main>
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="metrics">
          <!-- metric cards populated by JS -->
        </section>

        <section id="blocks" class="mb-6">
          <h2 class="text-lg font-medium mb-2">Recent Blocks</h2>
          <div id="blocks-list" class="space-y-2"></div>
        </section>
      </main>
    </div>

    <script src="/static/js/dashboard.js"></script>
  </body>
</html>
