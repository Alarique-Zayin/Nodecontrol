<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Bitcoin Node Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
      :root{
        --bg:#0f172a;
        --card-bg:#0b1220;
        --fg:#e6eef8;
        --muted:#9aa6b2;
      }
      /* small helper for metric sparklines */
      .spark-canvas { width:100% !important; height:30px !important; }
      .search-box { max-width:360px; }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
    <div class="max-w-6xl mx-auto p-4">
      <header class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-4">
          <h1 class="text-2xl font-semibold">Bitcoin Node Dashboard</h1>
          <input id="global-search" placeholder="Search block hash / txid" class="search-box px-3 py-1 rounded bg-white dark:bg-gray-800 text-sm" />
        </div>
        <div class="flex items-center gap-3">
          <button id="theme-toggle" aria-label="Toggle dark mode" class="px-3 py-1 bg-gray-200 dark:bg-gray-800 rounded">Toggle</button>
          <div id="status-pill" class="flex items-center gap-2">
            <div id="status-dot" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
            <div id="status-text" class="text-sm">Connecting...</div>
          </div>
        </div>
      </header>

        <!-- Search result modal (hidden by default) -->
        <div id="search-modal" class="fixed inset-0 flex items-center justify-center z-50 hidden">
          <div class="absolute inset-0 bg-black opacity-50"></div>
          <div class="relative bg-white dark:bg-gray-800 rounded shadow-lg w-11/12 max-w-3xl p-4">
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-lg font-semibold">Search Result</h3>
              <button id="search-close" class="px-2 py-1 bg-gray-200 dark:bg-gray-700 rounded">Close</button>
            </div>
            <div id="search-result-body" class="text-sm text-gray-800 dark:text-gray-200 overflow-auto max-h-96"></div>
          </div>
        </div>

      <main>
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="metrics">
          <!-- metric cards populated by JS -->
        </section>

        <section id="blocks" class="mb-6">
          <h2 class="text-lg font-medium mb-2">Recent Blocks</h2>
          <div id="blocks-list" class="space-y-2"></div>
        </section>
      </main>
    </div>

    <script src="/static/js/dashboard.js"></script>
    <script>
      // expose server WS token to client (may be empty)
      window.WS_TOKEN = {{ WS_TOKEN | tojson }};
    </script>
  </body>
</html>
